<!DOCTYPE html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020203;
}

body{
    font-family:"Cormorant Garamond",serif;
    color:#fff8df;
    touch-action:manipulation;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at center,
        transparent 20%,
        rgba(0,0,0,.18) 55%,
        rgba(0,0,0,.72) 100%);
    z-index:3;
}

#text{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    pointer-events:none;
    padding:30px;
}

.message{
    opacity:0;
    transform:translateY(18px);
    transition:
        opacity 1.8s ease,
        transform 1.8s ease,
        filter 1.8s ease;
    filter:blur(5px);
    max-width:850px;
}

.message.show{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
}

.message.hide{
    opacity:0;
    transform:translateY(-15px);
    filter:blur(7px);
}

.message .small{
    font-family:"Montserrat",sans-serif;
    font-size:clamp(11px,2vw,15px);
    letter-spacing:5px;
    text-transform:uppercase;
    opacity:.7;
    margin-bottom:18px;
}

.message .main{
    font-size:clamp(29px,5vw,62px);
    font-weight:300;
    line-height:1.08;
}

#flowerText{
    align-items:72%;
}

#forYou{
    position:absolute;
    bottom:17%;
    left:50%;
    transform:translateX(-50%) translateY(15px);
    opacity:0;
    transition:all 2s ease;
    font-size:clamp(30px,6vw,58px);
    font-weight:300;
    letter-spacing:2px;
    text-shadow:
        0 0 12px rgba(255,210,55,.35),
        0 0 35px rgba(255,190,30,.18);
}

#forYou.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

#flowerHint{
    position:absolute;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    font-family:"Montserrat",sans-serif;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:0;
    transition:opacity 1.5s ease;
}

#flowerHint.show{
    opacity:.45;
}

#finalMessage{
    align-items:center;
}

.finalLine{
    display:block;
    margin:8px 0;
}

#heartUI{
    position:fixed;
    left:50%;
    bottom:11%;
    transform:translateX(-50%) scale(.7);
    z-index:8;
    opacity:0;
    pointer-events:none;
    transition:
        opacity 1.8s ease,
        transform 1.8s cubic-bezier(.2,.8,.2,1);
    text-align:center;
}

#heartUI.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
    pointer-events:auto;
}

#heart{
    width:76px;
    height:76px;
    border-radius:50%;
    border:1px solid rgba(255,216,80,.35);
    background:
        radial-gradient(circle,
        rgba(255,215,65,.20),
        rgba(255,180,20,.04) 65%,
        transparent 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin:auto;
    box-shadow:
        0 0 25px rgba(255,195,30,.12),
        inset 0 0 25px rgba(255,210,50,.05);
    animation:heartGlow 2.5s ease-in-out infinite;
}

#heart span{
    font-size:34px;
    color:#ffd83d;
    text-shadow:
        0 0 10px #ffd83d,
        0 0 30px rgba(255,190,20,.8);
}

#heartHint{
    margin-top:13px;
    font-family:"Montserrat",sans-serif;
    font-size:9px;
    letter-spacing:4px;
    opacity:.45;
}

@keyframes heartGlow{
    0%,100%{
        box-shadow:
            0 0 20px rgba(255,195,30,.08),
            inset 0 0 20px rgba(255,210,50,.04);
    }
    50%{
        box-shadow:
            0 0 40px rgba(255,195,30,.25),
            inset 0 0 30px rgba(255,210,50,.08);
    }
}

#secret{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    pointer-events:none;
    opacity:0;
    transition:opacity 3s ease;
    padding:30px;
}

#secret.show{
    opacity:1;
}

.secretText{
    max-width:850px;
}

.secretText .one{
    font-size:clamp(24px,4vw,45px);
    font-weight:300;
    margin-bottom:28px;
}

.secretText .two{
    font-size:clamp(30px,5vw,62px);
    line-height:1.1;
}

#songName{
    position:fixed;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);
    z-index:11;
    font-family:"Montserrat",sans-serif;
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0;
    transition:opacity 3s ease;
    white-space:nowrap;
}

#songName.show{
    opacity:.35;
}

#clickArea{
    position:fixed;
    inset:0;
    z-index:6;
    pointer-events:none;
}

@media(max-width:600px){

    .message .main{
        font-size:34px;
    }

        bottom:11%;
    }

    #heart{
        width:68px;
        height:68px;
    }

    #heart span{
        font-size:30px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="vignette"></div>

<div id="text">

</div>

<div id="forYou">Para ti.</div>

    </div>
</div>

    Álvaro Díaz — Reina Pepiada
</div>

<audio id="music" preload="auto">
    <source src="https://github.com/falcondj51-pixel/Flores-Amarillas/raw/refs/heads/main/%C3%81lvaro%20D%C3%ADaz%20-%20Reina%20Pepiada%20%28Lyric%20Video%29.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, DPR;

function resize(){
    DPR = Math.min(window.devicePixelRatio || 1,2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   UTILIDADES
========================================================= */

function lerp(a,b,t){
    return a+(b-a)*t;
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function ease(t){
    return t<.5
        ? 4*t*t*t
        : 1-Math.pow(-2*t+2,3)/2;
}

function random(a,b){
    return a+Math.random()*(b-a);
}


/* =========================================================
   ESTADO
========================================================= */

let scene = "intro";

let time = 0;
let sceneStart = performance.now();

let mainFlower = {
    x: W/2,
    y: H*.72,
    growth:0,
    alive:true
};

let particles = [];
let flowers = [];
let butterfly = null;
let finalStarted = false;
let heartActive = false;
let heartUsed = false;

const introText = document.querySelector("#introText");
const introMain = introText.querySelector(".main");
const forYou = document.querySelector("#forYou");
const flowerHint = document.querySelector("#flowerHint");
const finalMessage = document.querySelector("#finalMessage");
const heartUI = document.querySelector("#heartUI");
const secret = document.querySelector("#secret");
const music = document.querySelector("#music");
const songName = document.querySelector("#songName");


/* =========================================================
   TEXTO
========================================================= */

function showIntro(text,duration=2600){

    introMain.textContent = text;

    introText.classList.remove("hide");
    void introText.offsetWidth;

    introText.classList.add("show");

    setTimeout(()=>{
        introText.classList.remove("show");
        introText.classList.add("hide");
    },duration);
}


/* =========================================================
   PARTÍCULAS
========================================================= */

class Particle{

    constructor(x,y,options={}){

        this.x=x;
        this.y=y;

        this.vx=options.vx ?? random(-.4,.4);
        this.vy=options.vy ?? random(-.8,.1);

        this.life=options.life ?? random(50,120);
        this.maxLife=this.life;

        this.size=options.size ?? random(.5,2.5);

        this.gold=options.gold ?? random(.5,1);

        this.gravity=options.gravity ?? -.005;

        this.twinkle=random(0,Math.PI*2);

        this.type=options.type || "normal";
    }

    update(){

        this.x+=this.vx;
        this.y+=this.vy;

        this.vy+=this.gravity;

        this.life--;

        this.twinkle+=.08;
    }

    draw(){

        const alpha=clamp(this.life/this.maxLife,0,1);
        const pulse=.7+.3*Math.sin(this.twinkle);

        ctx.globalAlpha=alpha*pulse;

        ctx.fillStyle=`rgba(255,${190+Math.floor(this.gold*50)},${55+Math.floor(this.gold*45)},1)`;

        ctx.shadowBlur=12;
        ctx.shadowColor="rgba(255,200,50,.8)";

        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();

        ctx.shadowBlur=0;
        ctx.globalAlpha=1;
    }
}

function createParticles(x,y,count,options={}){

    for(let i=0;i<count;i++){

        const angle=random(0,Math.PI*2);
        const speed=random(
            options.minSpeed ?? .2,
            options.maxSpeed ?? 1.5
        );

        particles.push(
            new Particle(
                x,
                y,
                {
                    vx:Math.cos(angle)*speed,
                    vy:Math.sin(angle)*speed,
                    life:options.life ?? random(70,150),
                    size:options.size ?? random(.6,2.2),
                    gravity:options.gravity ?? -.004,
                    gold:Math.random()
                }
            )
        );
    }
}


/* =========================================================
   LUZ CENTRAL
========================================================= */

let lightProgress=0;

function drawCentralLight(){

    const x=W/2;
    const y=H*.55;

    const p=clamp(lightProgress,0,1);

    const radius=70+160*p;

    const g=ctx.createRadialGradient(
        x,y,0,
        x,y,radius
    );

    g.addColorStop(0,`rgba(255,240,150,${.35*p})`);
    g.addColorStop(.15,`rgba(255,215,70,${.22*p})`);
    g.addColorStop(.5,`rgba(255,190,30,${.08*p})`);
    g.addColorStop(1,"rgba(255,180,20,0)");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    if(p>.15){

        const amount=Math.floor(2+p*3);

        for(let i=0;i<amount;i++){

            const angle=random(0,Math.PI*2);
            const dist=random(50,170)*p;

            const px=x+Math.cos(angle+time*.0002)*dist;
            const py=y+Math.sin(angle+time*.0002)*dist;

            ctx.globalAlpha=random(.15,.6)*p;
            ctx.fillStyle="#ffe36a";
            ctx.shadowBlur=15;
            ctx.shadowColor="#ffd23d";

            ctx.beginPath();
            ctx.arc(px,py,random(.5,1.7),0,Math.PI*2);
            ctx.fill();

            ctx.shadowBlur=0;
        }

        ctx.globalAlpha=1;
    }
}


/* =========================================================
   FLOR PRINCIPAL
========================================================= */

function drawLeaf(x,y,size,angle,alpha){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.globalAlpha=alpha;

    const gradient=ctx.createLinearGradient(
        0,0,size,0
    );

    gradient.addColorStop(0,"#21451f");
    gradient.addColorStop(.45,"#638c34");
    gradient.addColorStop(1,"#b5bd43");

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.bezierCurveTo(
        size*.25,-size*.35,
        size*.75,-size*.45,
        size,0
    );

    ctx.bezierCurveTo(
        size*.65,size*.28,
        size*.2,size*.22,
        0,0
    );

    ctx.fill();

    ctx.strokeStyle="rgba(220,230,120,.35)";
    ctx.lineWidth=1;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(size*.5,-size*.05,size*.88,0);
    ctx.stroke();

    ctx.restore();
}


function drawMainFlower(){

    if(!mainFlower.alive) return;

    const p=clamp(mainFlower.growth,0,1);

    const x=mainFlower.x;
    const ground=H*.84;

    const stemTop=lerp(ground,H*.47,ease(p));

    /* sombra */

    ctx.save();

    ctx.globalAlpha=.16*p;

    const shadow=ctx.createRadialGradient(
        x,ground,0,
        x,ground,90
    );

    shadow.addColorStop(0,"rgba(0,0,0,.8)");
    shadow.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=shadow;
    ctx.beginPath();
    ctx.ellipse(x,ground,100,18,0,0,Math.PI*2);
    ctx.fill();

    ctx.restore();


    /* tallo */

    if(p>.08){

        const stemP=clamp((p-.08)/.7,0,1);

        ctx.save();

        ctx.globalAlpha=stemP;

        const stemGradient=ctx.createLinearGradient(
            x,ground,
            x,stemTop
        );

        stemGradient.addColorStop(0,"#1c421d");
        stemGradient.addColorStop(.45,"#5d8733");
        stemGradient.addColorStop(1,"#a7ad45");

        ctx.strokeStyle=stemGradient;
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(x,ground);

        ctx.bezierCurveTo(
            x-8,ground-80,
            x+7,stemTop+65,
            x,stemTop
        );

        ctx.stroke();

        ctx.restore();


        /* hojas */

        if(p>.28){

            const leafP=clamp((p-.28)/.45,0,1);

            drawLeaf(
                x-2,
                ground-80,
                62*leafP,
                -2.7,
                leafP
            );

            drawLeaf(
                x+1,
                ground-125,
                54*leafP,
                -.35,
                leafP
            );
        }
    }


    /* flor */

    if(p>.45){

        const flowerP=clamp((p-.45)/.55,0,1);

        drawFlowerHead(
            x,
            stemTop,
            110*ease(flowerP),
            flowerP
        );
    }
}


function drawFlowerHead(x,y,size,p){

    const petals=11;

    ctx.save();

    ctx.translate(x,y);

    const wind=Math.sin(time*.0014)*.025;

    ctx.rotate(wind);

    for(let i=0;i<petals;i++){

        const a=(Math.PI*2/petals)*i;

        const petalP=clamp(
            (p-.05*(i%3))/0.95,
            0,
            1
        );

        ctx.save();

        ctx.rotate(a);

        ctx.globalAlpha=petalP;

        const grad=ctx.createRadialGradient(
            0,-size*.28,1,
            0,-size*.28,size*.48
        );

        grad.addColorStop(0,"#fff39a");
        grad.addColorStop(.35,"#ffd83d");
        grad.addColorStop(.75,"#f4b91c");
        grad.addColorStop(1,"#c98708");

        ctx.fillStyle=grad;

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.bezierCurveTo(
            -size*.20,-size*.12,
            -size*.27,-size*.50,
            0,-size*.67
        );

        ctx.bezierCurveTo(
            size*.27,-size*.50,
            size*.20,-size*.12,
            0,0
        );

        ctx.fill();

        ctx.restore();
    }


    /* centro */

    const center=ctx.createRadialGradient(
        0,0,0,
        0,0,size*.22
    );

    center.addColorStop(0,"#8a4f08");
    center.addColorStop(.4,"#9f600a");
    center.addColorStop(1,"#543007");

    ctx.globalAlpha=p;
    ctx.fillStyle=center;

    ctx.shadowBlur=20;
    ctx.shadowColor="rgba(255,190,20,.7)";

    ctx.beginPath();
    ctx.arc(0,0,size*.19,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    /* pequeños puntos del centro */

    for(let i=0;i<35;i++){

        const a=random(0,Math.PI*2);
        const r=random(0,size*.17);

        ctx.fillStyle="rgba(255,210,65,.8)";
        ctx.beginPath();
        ctx.arc(
            Math.cos(a)*r,
            Math.sin(a)*r,
            random(.5,1.5),
            0,Math.PI*2
        );
        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   MARIPOSA
========================================================= */

class Butterfly{

    constructor(){

        this.t=0;
        this.speed=.0026;
        this.alive=true;

        this.start={
            x:W*.38,
            y:H*.57
        };

        this.end={
            x:W*1.12,
            y:H*.28
        };

        this.x=this.start.x;
        this.y=this.start.y;

        this.trail=[];
    }

    update(){

        this.t+=this.speed;

        const t=clamp(this.t,0,1);

        const curve=Math.sin(t*Math.PI);

        this.x=lerp(
            this.start.x,
            this.end.x,
            t
        );

        this.y=
            lerp(this.start.y,this.end.y,t)
            - curve*H*.23;

        this.y+=Math.sin(time*.008)*9;

        this.trail.push({
            x:this.x,
            y:this.y
        });

        if(this.trail.length>90){
            this.trail.shift();
        }

        if(this.t>=1){
            this.alive=false;
        }
    }

    draw(){

        /* estela */

        for(let i=0;i<this.trail.length;i++){

            const p=this.trail[i];

            const alpha=i/this.trail.length;

            ctx.globalAlpha=alpha*.45;

            ctx.fillStyle="#ffd83d";
            ctx.shadowBlur=12;
            ctx.shadowColor="#ffc928";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                random(.7,2.1),
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        ctx.shadowBlur=0;

        /* mariposa */

        ctx.save();

        ctx.translate(this.x,this.y);

        const flap=Math.sin(time*.018)*.45;

        ctx.rotate(
            Math.atan2(
                Math.sin(time*.003)*2,
                10
            )
        );

        /* alas */

        ctx.globalAlpha=.9;

        const wingGradient=ctx.createRadialGradient(
            0,0,2,
            0,0,35
        );

        wingGradient.addColorStop(0,"#fff19a");
        wingGradient.addColorStop(.35,"#ffd83d");
        wingGradient.addColorStop(1,"rgba(255,180,20,.15)");

        ctx.fillStyle=wingGradient;

        /* izquierda */

        ctx.save();
        ctx.rotate(-flap);

        ctx.beginPath();
        ctx.moveTo(-3,0);
        ctx.bezierCurveTo(-15,-24,-35,-22,-30,-3);
        ctx.bezierCurveTo(-27,8,-12,10,-3,4);
        ctx.fill();

        ctx.restore();

        /* derecha */

        ctx.save();
        ctx.rotate(flap);

        ctx.beginPath();
        ctx.moveTo(3,0);
        ctx.bezierCurveTo(15,-24,35,-22,30,-3);
        ctx.bezierCurveTo(27,8,12,10,3,4);
        ctx.fill();

        ctx.restore();

        /* cuerpo */

        ctx.fillStyle="#4c310b";

        ctx.beginPath();
        ctx.ellipse(0,2,3,11,0,0,Math.PI*2);
        ctx.fill();

        ctx.restore();

        ctx.globalAlpha=1;
    }
}


/* =========================================================
   CAMPO FINAL
========================================================= */

function createFinalField(){

    flowers=[];

    const count=Math.min(
        150,
        Math.floor(W*H/6500)
    );

    for(let i=0;i<count;i++){

        const depth=Math.random();

        flowers.push({
            x:random(-80,W+80),
            y:random(H*.35,H*.95),
            size:lerp(12,72,depth),
            depth:depth,
            phase:random(0,Math.PI*2),
            sway:random(.5,1.8),
            delay:random(0,2),
            alpha:random(.35,1)
        });
    }

    flowers.sort((a,b)=>a.depth-b.depth);
}


function drawSmallFlower(f){

    const sway=
        Math.sin(time*.001*f.sway+f.phase)
        *f.size*.045;

    const x=f.x+sway;
    const y=f.y;

    const scale=.45+f.depth*.8;

    const s=f.size*scale;

    ctx.save();

    ctx.globalAlpha=f.alpha;

    /* tallo */

    ctx.strokeStyle="rgba(78,111,40,.8)";
    ctx.lineWidth=Math.max(1,s*.045);

    ctx.beginPath();
    ctx.moveTo(x,y+s*.35);
    ctx.quadraticCurveTo(
        x+s*.03,
        y,
        x+sway,
        y-s*.35
    );
    ctx.stroke();

    /* pétalos */

    const petals=9;

    for(let i=0;i<petals;i++){

        const a=i*Math.PI*2/petals;

        ctx.save();

        ctx.translate(x,y-s*.35);
        ctx.rotate(a);

        const g=ctx.createRadialGradient(
            0,-s*.1,1,
            0,-s*.1,s*.42
        );

        g.addColorStop(0,"#fff29a");
        g.addColorStop(.4,"#ffd83d");
        g.addColorStop(1,"#d99b13");

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.ellipse(
            0,
            -s*.25,
            s*.11,
            s*.29,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }

    ctx.fillStyle="#8c580a";

    ctx.beginPath();
    ctx.arc(
        x,
        y-s*.35,
        s*.09,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.restore();
}


/* =========================================================
   ESCENA
========================================================= */

function setScene(s){

    scene=s;
    sceneStart=performance.now();
}


/* =========================================================
   INTRO
========================================================= */

setTimeout(()=>{
    showIntro("Hay algo que quería darte...",2800);
},800);

setTimeout(()=>{
    showIntro("pero no encontré la manera de hacerlo.",3000);
},4100);

setTimeout(()=>{
    showIntro("Así que hice esto.",2400);
},7600);

setTimeout(()=>{
    setScene("flower");
},10500);


/* =========================================================
   CLICK FLOR
========================================================= */

function flowerClicked(){

    if(scene!=="flower") return;

    scene="flowerExplosion";

    forYou.classList.remove("show");
    flowerHint.classList.remove("show");

    /* explosión de la flor */

    createParticles(
        mainFlower.x,
        H*.47,
        500,
        {
            minSpeed:1,
            maxSpeed:5,
            life:random(100,170),
            size:random(.7,2.5),
            gravity:.012
        }
    );

    mainFlower.alive=false;

    setTimeout(()=>{

        butterfly=new Butterfly();

        scene="butterfly";

    },800);
}


/* =========================================================
   MARIPOSA + TEXTO
========================================================= */

let butterflyTextShown=false;

function butterflySequence(){

    if(
        butterfly &&
        butterfly.t>.22 &&
        !butterflyTextShown
    ){

        butterflyTextShown=true;

        setTimeout(()=>{
            showIntro(
                "Porque hay cosas que no caben en un mensaje...",
                3200
            );
        },100);
    }

    if(
        butterfly &&
        butterfly.t>.58
    ){

        /* segunda frase */

        if(!document.body.dataset.secondText){

            document.body.dataset.secondText="true";

            setTimeout(()=>{
                showIntro(
                    "...y tú eres una de ellas.",
                    3000
                );
            },100);
        }
    }

    if(
        butterfly &&
        !butterfly.alive &&
        !finalStarted
    ){

        finalStarted=true;

        setTimeout(startFinalScene,900);
    }
}


/* =========================================================
   FINAL
========================================================= */

function startFinalScene(){

    scene="final";

    createFinalField();

    finalMessage.classList.add("show");

    setTimeout(()=>{

        heartActive=true;
        heartUI.classList.add("show");

    },4200);
}


/* =========================================================
   CORAZÓN
========================================================= */

function heartClicked(){

    if(!heartActive || heartUsed) return;

    heartUsed=true;
    heartActive=false;

    heartUI.classList.remove("show");

    scene="heartExplosion";

    /* gran explosión */

    for(let i=0;i<1100;i++){

        const angle=random(0,Math.PI*2);

        const speed=random(1,8);

        particles.push(
            new Particle(
                W/2,
                H*.65,
                {
                    vx:Math.cos(angle)*speed,
                    vy:Math.sin(angle)*speed,
                    life:random(100,230),
                    size:random(.5,3),
                    gravity:.018
                }
            )
        );
    }

    /* reacción del campo */

    flowers.forEach(f=>{

        const dx=f.x-W/2;
        const dy=f.y-H*.65;

        const d=Math.sqrt(dx*dx+dy*dy)||1;

        f.x += dx/d*random(15,55);
        f.y += dy/d*random(10,40);
    });

    music.volume=0;

    music.play()
        .then(()=>{

            let v=0;

            const fade=setInterval(()=>{

                v+=.015;

                music.volume=Math.min(v,.7);

                if(v>=.7){
                    clearInterval(fade);
                }

            },100);

        })
        .catch(()=>{});

    songName.classList.add("show");

    finalMessage.classList.remove("show");

    setTimeout(()=>{

        secret.classList.add("show");

    },3800);
}


/* =========================================================
   CLICK / TOUCH
========================================================= */

function pointer(x,y){

    if(scene==="flower"){

        const dx=x-mainFlower.x;
        const dy=y-H*.47;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<140){
            flowerClicked();
        }
    }

    else if(
        scene==="final" &&
        heartActive
    ){

        const hx=W/2;
        const hy=H*.82;

        const dx=x-hx;
        const dy=y-hy;

        if(Math.sqrt(dx*dx+dy*dy)<100){

            heartClicked();
        }
    }
}

window.addEventListener("click",e=>{
    pointer(e.clientX,e.clientY);
});

window.addEventListener("touchstart",e=>{

    if(e.touches.length){

        pointer(
            e.touches[0].clientX,
            e.touches[0].clientY
        );
    }

},{passive:true});


/* =========================================================
   ANIMACIÓN PRINCIPAL
========================================================= */

function animate(now){

    time=now;

    ctx.clearRect(0,0,W,H);

    /* fondo */

    let bg;

    if(
        scene==="intro" ||
        scene==="flower" ||
        scene==="flowerExplosion" ||
        scene==="butterfly"
    ){

        bg=ctx.createRadialGradient(
            W*.5,
            H*.45,
            0,
            W*.5,
            H*.45,
            Math.max(W,H)*.9
        );

        bg.addColorStop(0,"#11100a");
        bg.addColorStop(.45,"#07080a");
        bg.addColorStop(1,"#010102");

    }else{

        bg=ctx.createLinearGradient(
            0,0,
            0,H
        );

        bg.addColorStop(0,"#05060b");
        bg.addColorStop(.42,"#0b100c");
        bg.addColorStop(1,"#161609");
    }

    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);


    /* luz */

    if(
        scene==="flower" ||
        scene==="flowerExplosion"
    ){

        const elapsed=
            performance.now()-sceneStart;

        lightProgress=clamp(
            elapsed/3500,
            0,
            1
        );

        drawCentralLight();
    }


    /* escena flor */

    if(scene==="flower"){

        mainFlower.x=W/2;

        mainFlower.growth=
            clamp(
                (performance.now()-sceneStart-500)/5000,
                0,
                1
            );

        drawMainFlower();

        if(
            mainFlower.growth>.92
        ){

            for(let i=0;i<2;i++){

                createParticles(
                    mainFlower.x+random(-70,70),
                    H*.47+random(-60,60),
                    1,
                    {
                        minSpeed:.1,
                        maxSpeed:.5,
                        life:80,
                        size:random(.5,1.4),
                        gravity:-.008
                    }
                );
            }

            if(!forYou.classList.contains("show")){
                forYou.classList.add("show");
                flowerHint.classList.add("show");
            }
        }
    }


    /* partículas */

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.update();
        p.draw();

        if(p.life<=0){
            particles.splice(i,1);
        }
    }


    /* mariposa */

    if(scene==="butterfly"){

        butterfly.update();
        butterfly.draw();

        butterflySequence();
    }


    /* campo */

    if(
        scene==="final" ||
        scene==="heartExplosion"
    ){

        /* luz del horizonte */

        const horizon=ctx.createRadialGradient(
            W*.5,
            H*.48,
            0,
            W*.5,
            H*.48,
            H*.65
        );

        horizon.addColorStop(
            0,
            "rgba(255,205,45,.16)"
        );

        horizon.addColorStop(
            .35,
            "rgba(255,180,20,.06)"
        );

        horizon.addColorStop(
            1,
            "rgba(255,180,20,0)"
        );

        ctx.fillStyle=horizon;
        ctx.fillRect(0,0,W,H);


        flowers.forEach(drawSmallFlower);


        /* partículas ambientales */

        if(Math.random()<.35){

            particles.push(
                new Particle(
                    random(0,W),
                    random(H*.25,H*.85),
                    {
                        vx:random(-.15,.15),
                        vy:random(-.5,-.05),
                        life:random(80,180),
                        size:random(.5,1.7),
                        gravity:-.003,
                        gold:Math.random()
                    }
                )
            );
        }
    }


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
