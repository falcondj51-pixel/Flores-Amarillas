<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💛</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050403;
}

body{
    font-family:Georgia,serif;
    color:white;
}

/* ESCENAS */

.scene{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:25px;
    opacity:0;
    visibility:hidden;
    transition:opacity 1s ease;
}

.scene.active{
    opacity:1;
    visibility:visible;
}


/* TEXTOS */

.introText{
    font-size:clamp(27px,6vw,52px);
    line-height:1.4;
    max-width:850px;
}

.fade{
    animation:fadeIn 1.2s ease forwards;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* ESCENA FLOR */

#flowerScene{
    background:
        radial-gradient(
            circle at center,
            #29220c 0%,
            #0d0b05 45%,
            #020202 100%
        );
}

.flower{
    position:relative;
    width:180px;
    height:350px;
    cursor:pointer;
    animation:flowerAppear 2s ease forwards;
}

@keyframes flowerAppear{
    from{
        opacity:0;
        transform:scale(.3);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.stem{
    position:absolute;
    width:9px;
    height:230px;
    background:#55752d;
    left:85px;
    top:110px;
    border-radius:10px;
}

.leaf{
    position:absolute;
    width:45px;
    height:95px;
    background:#648936;
    border-radius:100% 0 100% 0;
}

.leaf.left{
    left:35px;
    top:230px;
    transform:rotate(-35deg);
}

.leaf.right{
    right:30px;
    top:270px;
    transform:rotate(35deg);
}

.flowerHead{
    position:absolute;
    width:150px;
    height:150px;
    left:15px;
    top:0;
}

.petal{
    position:absolute;
    width:55px;
    height:85px;
    background:#ffd83d;
    border-radius:50%;
    left:47px;
    top:32px;
    transform-origin:28px 43px;
    box-shadow:0 0 12px rgba(255,215,60,.35);
}

.p1{transform:rotate(0deg) translateY(-38px);}
.p2{transform:rotate(45deg) translateY(-38px);}
.p3{transform:rotate(90deg) translateY(-38px);}
.p4{transform:rotate(135deg) translateY(-38px);}
.p5{transform:rotate(180deg) translateY(-38px);}
.p6{transform:rotate(225deg) translateY(-38px);}
.p7{transform:rotate(270deg) translateY(-38px);}
.p8{transform:rotate(315deg) translateY(-38px);}

.center{
    position:absolute;
    width:58px;
    height:58px;
    background:#805116;
    border-radius:50%;
    left:46px;
    top:46px;
    box-shadow:0 0 15px rgba(130,80,20,.6);
}

.flowerHint{
    margin-top:25px;
    font-size:17px;
    letter-spacing:2px;
    opacity:.75;
}


/* MARIPOSA */

.butterfly{
    position:absolute;
    width:60px;
    height:40px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    animation:flyAway 2.5s cubic-bezier(.4,0,.2,1) forwards;
}

.wing{
    position:absolute;
    width:30px;
    height:24px;
    background:#f7d56b;
    border-radius:70% 30% 70% 30%;
}

.wing.left{
    left:0;
    transform:rotate(-25deg);
}

.wing.right{
    right:0;
    transform:scaleX(-1) rotate(-25deg);
}

.body{
    position:absolute;
    width:6px;
    height:35px;
    background:#49351d;
    left:27px;
    top:2px;
    border-radius:10px;
}

@keyframes flyAway{

    0%{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%) scale(1);
    }

    30%{
        left:60%;
        top:42%;
    }

    60%{
        left:75%;
        top:30%;
    }

    100%{
        left:110%;
        top:15%;
        transform:translate(-50%,-50%) scale(.7);
    }

}


/* LLUVIA */

#rainScene{
    background:
        linear-gradient(
            to bottom,
            #050505,
            #151108
        );
}

.rain{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.rainFlower{
    position:absolute;
    top:-80px;
    font-size:25px;
    animation:fall linear infinite;
}

@keyframes fall{

    from{
        transform:translateY(-100px) rotate(0deg);
    }

    to{
        transform:translateY(110vh) rotate(360deg);
    }

}


/* MENSAJE FINAL */

.finalMessage{
    font-size:clamp(27px,5vw,50px);
    line-height:1.45;
    max-width:850px;
    z-index:3;
}


/* CORAZÓN */

.heart{
    margin-top:45px;
    font-size:110px;
    color:#ffd83d;
    text-shadow:
        0 0 15px #ffd83d,
        0 0 35px #ffb900,
        0 0 65px rgba(255,190,0,.7);
    cursor:pointer;
    animation:heartbeat 1.4s infinite;
    z-index:5;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.13);
    }

}


/* EXPLOSIÓN */

#explosionScene{
    background:#000;
}

.explosion{
    position:absolute;
    width:20px;
    height:20px;
    background:#ffd83d;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    animation:explode 2.5s ease forwards;
}

@keyframes explode{

    0%{
        width:20px;
        height:20px;
        opacity:1;
        box-shadow:0 0 30px #ffd83d;
    }

    100%{
        width:1600px;
        height:1600px;
        opacity:0;
        box-shadow:0 0 200px #ffd83d;
    }

}


/* SECRETO */

.secretText{
    font-size:clamp(27px,5vw,50px);
    line-height:1.45;
    max-width:850px;
}

</style>
</head>

<body>


<!-- INTRO -->

<section id="intro1" class="scene active">
    <div class="introText fade">
        Hay algo que quería darte...
    </div>
</section>


<section id="intro2" class="scene">
    <div class="introText fade">
        pero no encontré la manera de hacerlo.
    </div>
</section>


<section id="intro3" class="scene">
    <div class="introText fade">
        Así que hice esto.
    </div>
</section>


<!-- FLOR -->

<section id="flowerScene" class="scene">

    <div class="flower" id="flower">

        <div class="flowerHead">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="center"></div>

        </div>

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

    </div>

    <div class="flowerHint">
        toca la flor
    </div>

</section>


<!-- MARIPOSA -->

<section id="butterflyScene" class="scene">

    <div class="butterfly">

        <div class="wing left"></div>
        <div class="wing right"></div>

        <div class="body"></div>

    </div>

</section>


<!-- LLUVIA -->

<section id="rainScene" class="scene">

    <div class="rain">

        <span class="rainFlower" style="left:5%;animation-duration:5s;animation-delay:-1s;">🌼</span>
        <span class="rainFlower" style="left:12%;animation-duration:7s;animation-delay:-4s;">🌼</span>
        <span class="rainFlower" style="left:20%;animation-duration:6s;animation-delay:-2s;">🌼</span>
        <span class="rainFlower" style="left:28%;animation-duration:8s;animation-delay:-6s;">🌼</span>
        <span class="rainFlower" style="left:36%;animation-duration:5.5s;animation-delay:-3s;">🌼</span>
        <span class="rainFlower" style="left:44%;animation-duration:7s;animation-delay:-5s;">🌼</span>
        <span class="rainFlower" style="left:52%;animation-duration:6s;animation-delay:-1s;">🌼</span>
        <span class="rainFlower" style="left:60%;animation-duration:8s;animation-delay:-7s;">🌼</span>
        <span class="rainFlower" style="left:68%;animation-duration:5s;animation-delay:-2s;">🌼</span>
        <span class="rainFlower" style="left:76%;animation-duration:7s;animation-delay:-4s;">🌼</span>
        <span class="rainFlower" style="left:84%;animation-duration:6s;animation-delay:-1s;">🌼</span>
        <span class="rainFlower" style="left:92%;animation-duration:8s;animation-delay:-5s;">🌼</span>

    </div>

    <div class="finalMessage">
        Y esta es mi pequeña manera<br>
        de darte algo bonito. 💛

        <div class="heart" id="heart">
            ♥
        </div>
    </div>

</section>


<!-- EXPLOSIÓN -->

<section id="explosionScene" class="scene">

    <div class="explosion"></div>

</section>


<!-- MENSAJE SECRETO -->

<section id="secretScene" class="scene">

    <div class="secretText">
        Y si algún día te preguntas<br>
        por qué hice todo esto...<br><br>
        la respuesta siempre vas a ser tú. 💛
    </div>

</section>


<audio id="music" preload="auto">
    <source src="./Álvaro Díaz - Reina Pepiada (Lyric Video).mp3" type="audio/mpeg">
</audio>


<script>

const scenes = {

    intro1:document.getElementById("intro1"),
    intro2:document.getElementById("intro2"),
    intro3:document.getElementById("intro3"),
    flower:document.getElementById("flowerScene"),
    butterfly:document.getElementById("butterflyScene"),
    rain:document.getElementById("rainScene"),
    explosion:document.getElementById("explosionScene"),
    secret:document.getElementById("secretScene")

};

function show(name){

    Object.values(scenes).forEach(scene=>{
        scene.classList.remove("active");
    });

    scenes[name].classList.add("active");

}


// INTRO

setTimeout(()=>{
    show("intro2");
},4000);


setTimeout(()=>{
    show("intro3");
},8000);


setTimeout(()=>{
    show("flower");
},12000);


// FLOR

document.getElementById("flower").addEventListener("click",()=>{

    show("butterfly");

    setTimeout(()=>{

        show("rain");

    },2600);

});


// CORAZÓN

document.getElementById("heart").addEventListener("click",()=>{

    show("explosion");

    const music=document.getElementById("music");

    music.volume=.7;

    music.play().catch(()=>{});

    setTimeout(()=>{

        show("secret");

    },2800);

});

</script>

</body>
</html>
