<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💛</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Georgia, "Times New Roman", serif;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#text{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:clamp(26px,5vw,52px);
    line-height:1.3;
    letter-spacing:.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
    z-index:5;
}

#text.show{
    opacity:1;
}

#flowerHint{
    position:fixed;
    left:0;
    right:0;
    bottom:12%;
    text-align:center;
    font-size:18px;
    letter-spacing:2px;
    opacity:0;
    transition:opacity 1s ease;
    z-index:6;
    pointer-events:none;
}

#flowerHint.show{
    opacity:.75;
}

#heart{
    position:fixed;
    left:50%;
    bottom:10%;
    transform:translateX(-50%) scale(.8);
    font-size:86px;
    line-height:1;
    color:#ffd84d;
    text-shadow:
        0 0 10px #ffd84d,
        0 0 25px #ffbd00,
        0 0 50px rgba(255,190,0,.7);
    opacity:0;
    pointer-events:none;
    cursor:pointer;
    z-index:10;
    transition:opacity .8s ease, transform .8s ease;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

#heart.show{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) scale(1);
    animation:pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:translateX(-50%) scale(1);
    }
    50%{
        transform:translateX(-50%) scale(1.12);
    }
}

#secret{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:clamp(28px,5vw,54px);
    line-height:1.35;
    opacity:0;
    pointer-events:none;
    z-index:20;
    transition:opacity 1.5s ease;
    text-shadow:0 0 20px rgba(255,210,70,.7);
}

#secret.show{
    opacity:1;
}

#audio{
    display:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="text"></div>

<div id="flowerHint">
    toca la flor
</div>

<div id="heart">♥</div>

<div id="secret">
    Y si algún día te preguntas<br>
    por qué hice todo esto...<br><br>
    la respuesta siempre vas a ser tú. 💛
</div>

<audio id="audio" preload="auto" playsinline>
    <source src="./Álvaro Díaz - Reina Pepiada (Lyric Video).mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const text = document.getElementById("text");
const flowerHint = document.getElementById("flowerHint");
const heart = document.getElementById("heart");
const secret = document.getElementById("secret");
const audio = document.getElementById("audio");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


// -------------------------
// ESTADOS
// -------------------------

const INTRO1 = 0;
const INTRO2 = 1;
const INTRO3 = 2;
const LIGHT = 3;
const FLOWER = 4;
const BUTTERFLY = 5;
const RAIN = 6;
const FINAL = 7;
const HEART = 8;
const EXPLOSION = 9;
const SECRET = 10;

let state = INTRO1;
let stateStart = performance.now();

function setState(newState){

    state = newState;
    stateStart = performance.now();

    text.classList.remove("show");
    flowerHint.classList.remove("show");

    if(newState !== HEART){
        heart.classList.remove("show");
    }

    if(newState !== SECRET){
        secret.classList.remove("show");
    }
}


// -------------------------
// TEXTO
// -------------------------

function showText(message){

    text.innerHTML = message;
    text.classList.remove("show");

    requestAnimationFrame(()=>{
        text.classList.add("show");
    });
}


// -------------------------
// FLORES DE LLUVIA
// -------------------------

const rainFlowers = [];

for(let i=0;i<48;i++){

    rainFlowers.push({
        x:Math.random()*W,
        y:-Math.random()*H,
        size:5+Math.random()*10,
        speed:1.2+Math.random()*2.5,
        sway:Math.random()*Math.PI*2,
        swaySpeed:.01+Math.random()*.02,
        rotation:Math.random()*Math.PI*2,
        rotationSpeed:(Math.random()-.5)*.02,
        alpha:.45+Math.random()*.5
    });
}

function drawSmallFlower(f){

    ctx.save();

    ctx.translate(f.x,f.y);
    ctx.rotate(f.rotation);

    ctx.globalAlpha=f.alpha;

    // tallo
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(0,f.size*2.5);
    ctx.strokeStyle="rgba(80,130,40,.65)";
    ctx.lineWidth=1;
    ctx.stroke();

    // pétalos
    for(let i=0;i<5;i++){

        const a=i*Math.PI*2/5;

        ctx.save();
        ctx.rotate(a);

        ctx.beginPath();
        ctx.ellipse(
            0,
            -f.size*.65,
            f.size*.45,
            f.size*.8,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffd83d";
        ctx.fill();

        ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0,0,f.size*.28,0,Math.PI*2);
    ctx.fillStyle="#8a5a18";
    ctx.fill();

    ctx.restore();
}

function updateRain(){

    for(const f of rainFlowers){

        f.y += f.speed;
        f.sway += f.swaySpeed;
        f.rotation += f.rotationSpeed;

        f.x += Math.sin(f.sway)*.35;

        if(f.y > H+30){

            f.y=-20;
            f.x=Math.random()*W;
        }

        drawSmallFlower(f);
    }
}


// -------------------------
// FLOR PRINCIPAL
// -------------------------

const flower = {
    x:0,
    y:0,
    radius:70
};

function drawMainFlower(progress){

    flower.x=W/2;
    flower.y=H*.53;

    const p=Math.min(progress,1);

    ctx.save();

    // tallo
    ctx.beginPath();
    ctx.moveTo(flower.x,flower.y+20);
    ctx.quadraticCurveTo(
        flower.x-10,
        flower.y+130*p,
        flower.x-5,
        H
    );

    ctx.strokeStyle="#52752b";
    ctx.lineWidth=7;
    ctx.stroke();

    // hojas
    if(p>.45){

        ctx.beginPath();
        ctx.ellipse(
            flower.x-28,
            flower.y+100,
            18,
            45,
            -.7,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#668d31";
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(
            flower.x+30,
            flower.y+135,
            18,
            45,
            .7,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#5c8230";
        ctx.fill();
    }

    // flor
    const r=flower.radius*p;

    for(let i=0;i<12;i++){

        const a=i*Math.PI*2/12;

        ctx.save();
        ctx.translate(flower.x,flower.y);
        ctx.rotate(a);

        ctx.beginPath();

        ctx.ellipse(
            0,
            -r*.65,
            r*.42,
            r*.78,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle=`rgba(255,${185+Math.floor(40*p)},${30+Math.floor(30*p)},1)`;
        ctx.fill();

        ctx.restore();
    }

    // centro
    ctx.beginPath();
    ctx.arc(
        flower.x,
        flower.y,
        r*.38,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#7b4e13";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        flower.x,
        flower.y,
        r*.18,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#b97919";
    ctx.fill();

    ctx.restore();
}


// -------------------------
// PARTÍCULAS
// -------------------------

const particles=[];

function burst(x,y,count=100){

    particles.length=0;

    for(let i=0;i<count;i++){

        const a=Math.random()*Math.PI*2;
        const speed=1+Math.random()*5;

        particles.push({
            x,
            y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,
            life:1,
            size:1+Math.random()*4
        });
    }
}

function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.98;
        p.vy*=.98;

        p.vy+=.025;

        p.life-=.015;

        if(p.life<=0){
            particles.splice(i,1);
            continue;
        }

        ctx.globalAlpha=p.life;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

        ctx.fillStyle="#ffd84d";
        ctx.fill();
    }

    ctx.globalAlpha=1;
}


// -------------------------
// MARIPOSA
// -------------------------

let butterflyStart=0;

function drawButterfly(progress){

    const t=Math.min(progress,1);

    const startX=W*.5;
    const startY=H*.52;

    const endX=W*1.15;
    const endY=H*.16;

    // trayectoria curva
    const x=
        startX+
        (endX-startX)*t+
        Math.sin(t*10)*35*(1-t);

    const y=
        startY+
        (endY-startY)*t+
        Math.sin(t*8)*45*(1-t);

    // brillo
    ctx.beginPath();
    ctx.arc(x,y,12,0,Math.PI*2);

    ctx.fillStyle="rgba(255,220,100,.15)";
    ctx.fill();

    // alas
    const flap=Math.sin(performance.now()*.025)*.45;

    ctx.save();
    ctx.translate(x,y);

    ctx.rotate(-.2);

    ctx.beginPath();
    ctx.ellipse(
        -8,
        -4,
        13,
        8+flap*4,
        -.5,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f4d36a";
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
        8,
        -4,
        13,
        8-flap*4,
        .5,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f8df82";
    ctx.fill();

    ctx.fillStyle="#4a351d";

    ctx.beginPath();
    ctx.ellipse(0,0,3,10,0,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    return {x,y};
}


// -------------------------
// EXPLOSIÓN FINAL
// -------------------------

let explosionStart=0;

function drawExplosion(progress){

    const r=progress*Math.max(W,H)*.8;

    const gradient=ctx.createRadialGradient(
        W/2,
        H/2,
        0,
        W/2,
        H/2,
        r
    );

    gradient.addColorStop(0,"rgba(255,240,150,.9)");
    gradient.addColorStop(.2,"rgba(255,210,70,.35)");
    gradient.addColorStop(1,"rgba(255,190,0,0)");

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);

    updateParticles();
}


// -------------------------
// FONDO
// -------------------------

function background(){

    const gradient=ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );

    gradient.addColorStop(0,"#030304");
    gradient.addColorStop(.55,"#10100b");
    gradient.addColorStop(1,"#19170d");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);
}


// -------------------------
// LOOP
// -------------------------

function loop(now){

    background();

    const elapsed=now-stateStart;

    // INTRO 1
    if(state===INTRO1){

        if(elapsed>600){
            showText("Hay algo que quería darte...");
        }

        if(elapsed>3000){
            setState(INTRO2);
            showText("pero no encontré la manera de hacerlo.");
        }
    }

    // INTRO 2
    else if(state===INTRO2){

        if(elapsed>3000){
            setState(INTRO3);
            showText("Así que hice esto.");
        }
    }

    // INTRO 3
    else if(state===INTRO3){

        if(elapsed>2800){
            setState(LIGHT);
        }
    }

    // LUZ
    else if(state===LIGHT){

        const p=Math.min(elapsed/1800,1);

        const radius=80+400*p;

        const g=ctx.createRadialGradient(
            W/2,
            H*.55,
            0,
            W/2,
            H*.55,
            radius
        );

        g.addColorStop(0,"rgba(255,220,100,.85)");
        g.addColorStop(.3,"rgba(255,190,50,.3)");
        g.addColorStop(1,"rgba(0,0,0,0)");

        ctx.fillStyle=g;
        ctx.fillRect(0,0,W,H);

        if(elapsed>1800){
            setState(FLOWER);
            flowerHint.classList.add("show");
        }
    }

    // FLOR
    else if(state===FLOWER){

        const p=Math.min(elapsed/1600,1);

        drawMainFlower(p);

        if(elapsed>1800){
            flowerHint.classList.add("show");
        }
    }

    // MARIPOSA
    else if(state===BUTTERFLY){

        const p=Math.min(elapsed/2400,1);

        drawMainFlower(1);

        const b=drawButterfly(p);

        updateParticles();

        if(elapsed>700 && elapsed<1700){

            showText("Porque hay cosas que no caben en una simple flor.");

        }

        if(p>=1){

            setState(RAIN);
        }
    }

    // LLUVIA
    else if(state===RAIN){

        updateRain();

        if(elapsed>1400){

            setState(FINAL);

            showText(
                "Y esta es mi pequeña manera<br>de darte algo bonito. 💛"
            );
        }
    }

    // MENSAJE FINAL
    else if(state===FINAL){

        updateRain();

        if(elapsed>2200){

            heart.classList.add("show");
            setState(HEART);
        }
    }

    // CORAZÓN
    else if(state===HEART){

        updateRain();
    }

    // EXPLOSIÓN
    else if(state===EXPLOSION){

        updateRain();

        const p=Math.min(elapsed/2600,1);

        drawExplosion(p);

        if(elapsed>1300){

            if(audio.paused){

                audio.volume=0;
                audio.play().catch(()=>{});

                let volume=0;

                const fade=setInterval(()=>{

                    volume+=.03;

                    if(volume>=1){
                        volume=1;
                        clearInterval(fade);
                    }

                    audio.volume=volume;

                },80);
            }
        }

        if(elapsed>2700){

            setState(SECRET);
            secret.classList.add("show");
        }
    }

    // MENSAJE SECRETO
    else if(state===SECRET){

        updateRain();
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


// -------------------------
// CLICK FLOR
// -------------------------

function flowerClicked(x,y){

    if(state!==FLOWER) return;

    const dx=x-flower.x;
    const dy=y-flower.y;

    if(Math.sqrt(dx*dx+dy*dy)<110){

        flowerHint.classList.remove("show");

        burst(
            flower.x,
            flower.y,
            120
        );

        setState(BUTTERFLY);
    }
}


// -------------------------
// CLICK / TOUCH
// -------------------------

canvas.addEventListener("click",(e)=>{

    flowerClicked(
        e.clientX,
        e.clientY
    );
});

canvas.addEventListener("touchstart",(e)=>{

    const touch=e.touches[0];

    flowerClicked(
        touch.clientX,
        touch.clientY
    );

},{passive:true});


// -------------------------
// CORAZÓN
// -------------------------

heart.addEventListener("click",()=>{

    heart.classList.remove("show");

    burst(
        W/2,
        H*.5,
        180
    );

    setState(EXPLOSION);

});

</script>

</body>
</html>
