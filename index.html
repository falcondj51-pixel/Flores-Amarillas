<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💛</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:'Cormorant Garamond',serif;
    color:#fff;
}

.scene{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    transition:
        background 3s ease;
}

.text{
    text-align:center;

    font-size:clamp(28px,5vw,55px);

    font-weight:300;

    letter-spacing:1px;

    opacity:0;

    transform:translate3d(0,20px,0);

    transition:
        opacity 1.8s ease,
        transform 1.8s ease;

    padding:30px;

    will-change:opacity, transform;
}

.text.show{
    opacity:1;
    transform:translate3d(0,0,0);
}

.text.hide{
    opacity:0;
    transform:translate3d(0,-20px,0);
}
    transform:translateY(-20px);
}

</style>
</head>

<body>

<div class="scene">

    <div id="text" class="text"></div>

</div>


<script>

const text = document.getElementById("text");


function showText(message,time){

    text.innerHTML = message;

    text.classList.remove("hide");

    setTimeout(()=>{

        text.classList.add("show");

    },100);

    setTimeout(()=>{

        text.classList.remove("show");
        text.classList.add("hide");

    },time);

}


/* PRIMERA FRASE */

setTimeout(()=>{

    showText(
        "Hay algo que quería darte...",
        3000
    );

},1500);


/* SEGUNDA FRASE */

setTimeout(()=>{

    showText(
        "pero no encontré la manera de hacerlo.",
        3200
    );

},5000);


/* TERCERA FRASE */

setTimeout(()=>{

    showText(
        "Así que hice esto.",
        2800
    );

},8800);

</script>

</body>
</html>
