<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030305">

<title>Para ti 🌻</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020204;
}

body{
    font-family:"Cormorant Garamond",serif;
    color:#fff6d7;
    user-select:none;
    -webkit-user-select:none;
}

#world{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#020204;
}

/* =========================================================
   CAPAS GENERALES
========================================================= */

#stars,
#goldDust,
#burstLayer,
#flowerLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#stars{
    opacity:0;
    transition:opacity 3s ease;
}

#goldDust{
    opacity:0;
    transition:opacity 3s ease;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff2bd;
    box-shadow:0 0 8px rgba(255,215,100,.8);
    animation:twinkle var(--duration) ease-in-out infinite;
    animation-delay:var(--delay);
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }

    50%{
        opacity:.9;
        transform:scale(1.5);
    }
}

/* =========================================================
   INTRO
========================================================= */

#intro{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    background:#020204;
    transition:opacity 2s ease;
}

#introText{
    width:min(850px,88%);
    text-align:center;
    font-size:clamp(30px,5vw,58px);
    line-height:1.15;
    font-weight:300;
    letter-spacing:.5px;

    opacity:0;
    filter:blur(12px);
    transform:translateY(10px);

    transition:
        opacity 1.8s ease,
        filter 1.8s ease,
        transform 1.8s ease;
}

#introText.show{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
}

/* =========================================================
   LUZ
========================================================= */

#lightScene{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity 2s ease;
}

#light{
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff5a2;

    box-shadow:
        0 0 10px #ffe873,
        0 0 30px #ffd63e,
        0 0 70px rgba(255,196,35,.8),
        0 0 140px rgba(255,169,0,.35);

    transform:scale(.2);

    transition:
        transform 4s cubic-bezier(.15,.75,.15,1),
        box-shadow 4s ease;
}

#lightScene.active{
    opacity:1;
}

#light.growing{
    transform:scale(12);

    box-shadow:
        0 0 20px #fff2a0,
        0 0 70px #ffd83e,
        0 0 180px rgba(255,192,30,.8),
        0 0 350px rgba(255,160,0,.4);
}

/* =========================================================
   FLOR CENTRAL
========================================================= */

#flowerScene{
    position:absolute;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    transition:opacity 2s ease;
}

#flowerScene.active{
    opacity:1;
}

.flower{
    position:relative;
    width:210px;
    height:210px;

    transform:scale(.05);
    opacity:0;

    cursor:pointer;

    filter:
        drop-shadow(0 0 15px rgba(255,218,73,.45))
        drop-shadow(0 0 45px rgba(255,181,22,.25));

    transition:
        transform 2.5s cubic-bezier(.15,.8,.15,1),
        opacity 2s ease;
}

.flower.reveal{
    transform:scale(1);
    opacity:1;
}

.petal{
    position:absolute;

    left:50%;
    top:50%;

    width:70px;
    height:108px;

    margin-left:-35px;
    margin-top:-78px;

    border-radius:55% 55% 48% 48%;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            #fff9a2 0%,
            #ffe34e 28%,
            #f7bd24 65%,
            #c77c0b 100%
        );

    transform-origin:50% 72%;

    opacity:0;

    box-shadow:
        inset 0 -10px 15px rgba(151,78,0,.18),
        0 0 12px rgba(255,211,54,.25);

    animation:none;
}

.flower.reveal .petal{
    animation:petalAppear 1.8s cubic-bezier(.2,.8,.2,1) forwards;
}

.petal:nth-child(1){transform:rotate(0deg) translateY(-12px);}
.petal:nth-child(2){transform:rotate(45deg) translateY(-12px);}
.petal:nth-child(3){transform:rotate(90deg) translateY(-12px);}
.petal:nth-child(4){transform:rotate(135deg) translateY(-12px);}
.petal:nth-child(5){transform:rotate(180deg) translateY(-12px);}
.petal:nth-child(6){transform:rotate(225deg) translateY(-12px);}
.petal:nth-child(7){transform:rotate(270deg) translateY(-12px);}
.petal:nth-child(8){transform:rotate(315deg) translateY(-12px);}

.flower.reveal .petal:nth-child(1){animation-delay:.05s;}
.flower.reveal .petal:nth-child(2){animation-delay:.15s;}
.flower.reveal .petal:nth-child(3){animation-delay:.25s;}
.flower.reveal .petal:nth-child(4){animation-delay:.35s;}
.flower.reveal .petal:nth-child(5){animation-delay:.45s;}
.flower.reveal .petal:nth-child(6){animation-delay:.55s;}
.flower.reveal .petal:nth-child(7){animation-delay:.65s;}
.flower.reveal .petal:nth-child(8){animation-delay:.75s;}

@keyframes petalAppear{
    0%{
        opacity:0;
        transform:scale(.1) rotate(var(--rotation)) translateY(-12px);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
    }
}

.flowerCenter{
    position:absolute;

    width:62px;
    height:62px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%) scale(0);

    border-radius:50%;

    background:
        radial-gradient(circle at 40% 35%,
            #8f5a10,
            #583006 55%,
            #241100 100%
        );

    box-shadow:
        0 0 15px rgba(255,199,51,.5),
        inset 0 0 12px rgba(0,0,0,.5);

    transition:transform 1.5s ease 1s;
}

.flower.reveal .flowerCenter{
    transform:translate(-50%,-50%) scale(1);
}

.flowerLabel{
    position:absolute;

    left:50%;
    bottom:-100px;

    transform:translateX(-50%);

    font-size:28px;
    letter-spacing:2px;

    white-space:nowrap;

    opacity:0;

    transition:
        opacity 2s ease,
        transform 2s ease;
}

.flowerLabel.show{
    opacity:.9;
    transform:translateX(-50%) translateY(-5px);
}

/* =========================================================
   TEXTO DE ESCENA
========================================================= */

.sceneText{
    position:absolute;

    left:50%;
    top:23%;

    transform:translateX(-50%);

    width:min(900px,88%);

    text-align:center;

    font-size:clamp(28px,4.6vw,52px);
    line-height:1.2;
    font-weight:300;

    opacity:0;
    filter:blur(10px);

    transition:
        opacity 2.5s ease,
        filter 2.5s ease;

    z-index:40;
}

.sceneText.show{
    opacity:1;
    filter:blur(0);
}

/* =========================================================
   MARIPOSA
========================================================= */

#butterfly{
    position:absolute;

    width:72px;
    height:65px;

    left:-100px;
    top:65%;

    z-index:45;

    opacity:0;

    cursor:pointer;
}

#butterfly.fly{
    opacity:1;

    animation:
        butterflyPath 6s cubic-bezier(.18,.75,.2,1) forwards;
}

@keyframes butterflyPath{

    0%{
        left:-100px;
        top:72%;
        transform:rotate(-15deg) scale(.7);
    }

    18%{
        left:12%;
        top:55%;
        transform:rotate(8deg) scale(.85);
    }

    35%{
        left:29%;
        top:67%;
        transform:rotate(-8deg) scale(.95);
    }

    53%{
        left:47%;
        top:49%;
        transform:rotate(10deg) scale(1);
    }

    72%{
        left:64%;
        top:62%;
        transform:rotate(-6deg) scale(1);
    }

    88%{
        left:73%;
        top:53%;
        transform:rotate(4deg) scale(1);
    }

    100%{
        left:77%;
        top:57%;
        transform:rotate(0deg) scale(1);
    }
}

.wing{
    position:absolute;

    top:8px;

    width:34px;
    height:48px;

    background:
        radial-gradient(circle at 50% 25%,
            #fff48c,
            #ffd13e 45%,
            #d98d0c 100%
        );

    box-shadow:
        0 0 14px rgba(255,213,56,.7);

    animation:wingFlap .45s ease-in-out infinite alternate;
}

.wing.left{
    left:0;
    border-radius:75% 25% 70% 30%;
    transform-origin:100% 80%;
}

.wing.right{
    right:0;
    border-radius:25% 75% 30% 70%;
    transform-origin:0% 80%;
}

@keyframes wingFlap{
    from{transform:rotateY(0deg) rotateZ(-3deg);}
    to{transform:rotateY(65deg) rotateZ(3deg);}
}

.butterflyBody{
    position:absolute;

    left:50%;
    top:10px;

    width:9px;
    height:50px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            to right,
            #1c1203,
            #6c460d,
            #1c1203
        );

    z-index:3;
}

/* =========================================================
   TRAIL
========================================================= */

#trail{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:35;
}

.trailParticle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ffe36b;

    box-shadow:
        0 0 8px #ffd83e,
        0 0 18px rgba(255,188,30,.8);

    animation:trailFade 1.8s ease-out forwards;
}

@keyframes trailFade{
    0%{
        opacity:0;
        transform:scale(.2);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(0);
    }
}

/* =========================================================
   ESCENA FINAL
========================================================= */

#finalScene{
    position:absolute;
    inset:0;

    z-index:15;

    opacity:0;

    background:
        radial-gradient(
            ellipse at 50% 55%,
            rgba(255,187,31,.13),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 50% 100%,
            rgba(255,159,0,.08),
            transparent 55%
        ),
        linear-gradient(
            to bottom,
            #020204 0%,
            #050403 55%,
            #100902 100%
        );

    transition:opacity 4s ease;
}

#finalScene.show{
    opacity:1;
}

/* =========================================================
   FLORES FINALES
========================================================= */

.finalFlower{
    position:absolute;

    width:42px;
    height:42px;

    transform:scale(0);

    opacity:.9;

    animation:
        finalFlowerAppear 1.5s cubic-bezier(.2,.8,.2,1) forwards,
        flowerFloat 6s ease-in-out infinite;

    animation-delay:
        var(--appear),
        calc(var(--appear) + 1.5s);
}

.finalFlower .fpetal{
    position:absolute;

    left:50%;
    top:50%;

    width:15px;
    height:27px;

    margin-left:-7px;
    margin-top:-20px;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            #fff27a,
            #f5c027 65%,
            #c9820b
        );

    transform-origin:50% 75%;
}

.finalFlower .fpetal:nth-child(1){transform:rotate(0deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(2){transform:rotate(45deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(3){transform:rotate(90deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(4){transform:rotate(135deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(5){transform:rotate(180deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(6){transform:rotate(225deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(7){transform:rotate(270deg) translateY(-5px);}
.finalFlower .fpetal:nth-child(8){transform:rotate(315deg) translateY(-5px);}

.finalFlower .fcenter{
    position:absolute;

    width:12px;
    height:12px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#4e2a04;

    box-shadow:0 0 8px rgba(255,195,35,.7);
}

@keyframes finalFlowerAppear{
    from{
        transform:scale(0) translateY(30px);
        opacity:0;
    }

    to{
        transform:scale(var(--scale)) translateY(0);
        opacity:.9;
    }
}

@keyframes flowerFloat{
    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-12px;
    }
}

/* =========================================================
   POLVO DORADO
========================================================= */

.dust{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#ffd95b;

    box-shadow:
        0 0 8px #ffc72c,
        0 0 15px rgba(255,184,20,.7);

    opacity:.5;

    animation:
        dustMove var(--time) ease-in-out infinite;

    animation-delay:var(--delay);
}

@keyframes dustMove{

    0%{
        transform:
            translate3d(0,0,0)
            scale(.5);
        opacity:.1;
    }

    30%{
        opacity:.7;
    }

    50%{
        transform:
            translate3d(
                var(--x),
                var(--y),
                0
            )
            scale(1);
    }

    100%{
        transform:
            translate3d(
                var(--x2),
                var(--y2),
                0
            )
            scale(.4);
        opacity:0;
    }
}

/* =========================================================
   MENSAJE FINAL
========================================================= */

#finalMessage{
    position:absolute;

    left:50%;
    top:46%;

    transform:translate(-50%,-50%);

    width:min(1000px,88%);

    text-align:center;

    font-size:clamp(31px,5vw,58px);
    line-height:1.18;
    font-weight:300;

    opacity:0;
    filter:blur(15px);

    z-index:70;

    transition:
        opacity 3s ease,
        filter 3s ease;
}

#finalMessage.show{
    opacity:1;
    filter:blur(0);
}

/* =========================================================
   CORAZÓN
========================================================= */

#heart{
    position:absolute;

    left:50%;
    bottom:12%;

    transform:translateX(-50%) scale(.6);

    width:90px;
    height:90px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:90;

    cursor:pointer;

    opacity:0;

    transition:
        opacity 2s ease,
        transform .35s ease;
}

#heart.show{
    opacity:1;

    animation:
        heartEntrance 1.5s cubic-bezier(.2,.8,.2,1) forwards,
        heartbeat 1.8s ease-in-out 1.5s infinite;
}

.heartShape{
    position:relative;

    width:58px;
    height:58px;

    transform:rotate(-45deg);

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff3a0,
            #ffd348 35%,
            #e7a51a 75%,
            #a96506
        );

    filter:
        drop-shadow(0 0 10px rgba(255,213,55,.8))
        drop-shadow(0 0 30px rgba(255,176,15,.45));
}

.heartShape::before,
.heartShape::after{
    content:"";

    position:absolute;

    width:58px;
    height:58px;

    border-radius:50%;

    background:inherit;
}

.heartShape::before{
    top:-29px;
    left:0;
}

.heartShape::after{
    left:29px;
    top:0;
}

@keyframes heartEntrance{
    0%{
        transform:translateX(-50%) scale(0);
        opacity:0;
    }

    70%{
        transform:translateX(-50%) scale(1.15);
        opacity:1;
    }

    100%{
        transform:translateX(-50%) scale(1);
        opacity:1;
    }
}

@keyframes heartbeat{
    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.1);
    }
}

#heartHint{
    position:absolute;

    left:50%;
    bottom:5.5%;

    transform:translateX(-50%);

    z-index:90;

    font-family:"Montserrat",sans-serif;

    font-size:11px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:rgba(255,245,205,.65);

    opacity:0;

    transition:opacity 2s ease;
}

#heartHint.show{
    opacity:1;
}

/* =========================================================
   MENSAJE SECRETO
========================================================= */

#secretMessage{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    pointer-events:none;

    opacity:0;
    filter:blur(15px);

    transition:
        opacity 3s ease,
        filter 3s ease;
}

#secretMessage.show{
    opacity:1;
    filter:blur(0);
}

.secretContent{
    width:min(850px,86%);

    text-align:center;

    font-size:clamp(30px,5vw,58px);

    line-height:1.2;

    font-weight:300;
}

.secretSmall{
    margin-top:28px;

    font-family:"Montserrat",sans-serif;

    font-size:12px;

    letter-spacing:4px;

    text-transform:uppercase;

    opacity:.55;
}

/* =========================================================
   FLASH
========================================================= */

#flash{
    position:absolute;
    inset:0;

    z-index:200;

    pointer-events:none;

    background:#fff7bd;

    opacity:0;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .flower{
        width:170px;
        height:170px;
    }

    .petal{
        width:56px;
        height:87px;

        margin-left:-28px;
        margin-top:-64px;
    }

    .flowerCenter{
        width:50px;
        height:50px;
    }

    .flowerLabel{
        bottom:-80px;
        font-size:23px;
    }

    .sceneText{
        top:20%;
        width:84%;
    }

    #finalMessage{
        top:43%;
        width:86%;
    }

    #heart{
        bottom:14%;
    }

    #heartHint{
        bottom:7%;
    }

    .finalFlower{
        width:34px;
        height:34px;
    }
}

</style>
</head>

<body>

<div id="world">

    <!-- CAPAS -->
    <div id="stars"></div>
    <div id="goldDust"></div>
    <div id="trail"></div>
    <div id="burstLayer"></div>

    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section id="intro">
        <div id="introText"></div>
    </section>


    <!-- =====================================================
         LUZ
    ====================================================== -->

    <section id="lightScene">
        <div id="light"></div>
    </section>


    <!-- =====================================================
         FLOR
    ====================================================== -->

    <section id="flowerScene">

        <div class="flower" id="mainFlower">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="flowerCenter"></div>

            <div class="flowerLabel" id="flowerLabel">
                Para ti.
            </div>

        </div>

    </section>


    <!-- =====================================================
         MARIPOSA
    ====================================================== -->

    <div id="butterfly">

        <div class="wing left"></div>
        <div class="wing right"></div>

        <div class="butterflyBody"></div>

    </div>


    <!-- TEXTO DE LA MARIPOSA -->

    <div class="sceneText" id="butterflyText">
        Porque hay cosas que no caben en un mensaje...
        <br><br>
        ...y tú eres una de ellas.
    </div>


    <!-- =====================================================
         ESCENA FINAL
    ====================================================== -->

    <section id="finalScene"></section>


    <!-- MENSAJE -->

    <div id="finalMessage">
        Aunque hoy no pueda dártelas en persona,
        <br>
        quería que tuvieras tus flores amarillas. 💛
    </div>


    <!-- CORAZÓN -->

    <div id="heart">

        <div class="heartShape"></div>

    </div>

    <div id="heartHint">
        toca el corazón
    </div>


    <!-- =====================================================
         MENSAJE SECRETO
    ====================================================== -->

    <div id="secretMessage">

        <div class="secretContent">

            Y si te preguntas por qué hice todo esto...

            <br><br>

            es simplemente porque eres alguien
            <br>
            muy especial para mí.

            <div class="secretSmall">
                💛
            </div>

        </div>

    </div>


    <!-- FLASH -->

    <div id="flash"></div>


    <!-- =====================================================
         MÚSICA
    ====================================================== -->

    <audio
        id="music"
        preload="auto"
        loop>

        <source
            src="https://github.com/falcondj51-pixel/Flores-Amarillas/raw/refs/heads/main/%C3%81lvaro%20D%C3%ADaz%20-%20Reina%20Pepiada%20%28Lyric%20Video%29.mp3"
            type="audio/mpeg">

    </audio>

</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const intro = document.getElementById("intro");
const introText = document.getElementById("introText");

const lightScene = document.getElementById("lightScene");
const light = document.getElementById("light");

const flowerScene = document.getElementById("flowerScene");
const mainFlower = document.getElementById("mainFlower");
const flowerLabel = document.getElementById("flowerLabel");

const butterfly = document.getElementById("butterfly");
const butterflyText = document.getElementById("butterflyText");

const finalScene = document.getElementById("finalScene");
const finalMessage = document.getElementById("finalMessage");

const heart = document.getElementById("heart");
const heartHint = document.getElementById("heartHint");

const secretMessage = document.getElementById("secretMessage");

const stars = document.getElementById("stars");
const goldDust = document.getElementById("goldDust");
const trail = document.getElementById("trail");
const burstLayer = document.getElementById("burstLayer");

const flash = document.getElementById("flash");

const music = document.getElementById("music");


/* =========================================================
   UTILIDADES
========================================================= */

function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}


/* =========================================================
   TEXTO SUAVE
========================================================= */

async function showIntroText(text,duration){

    introText.classList.remove("show");

    await wait(700);

    introText.textContent = text;

    introText.classList.add("show");

    await wait(duration);

    introText.classList.remove("show");

    await wait(1200);
}


/* =========================================================
   ESTRELLAS
========================================================= */

function createStars(amount=100){

    for(let i=0;i<amount;i++){

        const star=document.createElement("div");

        star.className="star";

        star.style.left=Math.random()*100+"%";
        star.style.top=Math.random()*100+"%";

        star.style.setProperty(
            "--duration",
            (2+Math.random()*4)+"s"
        );

        star.style.setProperty(
            "--delay",
            Math.random()*4+"s"
        );

        stars.appendChild(star);
    }
}


/* =========================================================
   POLVO DORADO
========================================================= */

function createGoldDust(amount=250){

    for(let i=0;i<amount;i++){

        const dust=document.createElement("div");

        dust.className="dust";

        dust.style.left=Math.random()*100+"%";
        dust.style.top=Math.random()*100+"%";

        dust.style.setProperty(
            "--time",
            (6+Math.random()*8)+"s"
        );

        dust.style.setProperty(
            "--delay",
            (-Math.random()*10)+"s"
        );

        dust.style.setProperty(
            "--x",
            (-60+Math.random()*120)+"px"
        );

        dust.style.setProperty(
            "--y",
            (-100+Math.random()*200)+"px"
        );

        dust.style.setProperty(
            "--x2",
            (-120+Math.random()*240)+"px"
        );

        dust.style.setProperty(
            "--y2",
            (-160+Math.random()*320)+"px"
        );

        goldDust.appendChild(dust);
    }
}


/* =========================================================
   TRAIL DE MARIPOSA
========================================================= */

let trailRunning=false;

function butterflyTrail(){

    if(trailRunning) return;

    trailRunning=true;

    const interval=setInterval(()=>{

        if(!document.body.contains(butterfly)){
            clearInterval(interval);
            return;
        }

        const rect=butterfly.getBoundingClientRect();

        const particle=document.createElement("div");

        particle.className="trailParticle";

        particle.style.left=
            rect.left + rect.width/2 +
            (Math.random()*15-7)+"px";

        particle.style.top=
            rect.top + rect.height/2 +
            (Math.random()*15-7)+"px";

        trail.appendChild(particle);

        setTimeout(()=>{
            particle.remove();
        },1800);

    },65);

    setTimeout(()=>{
        clearInterval(interval);
        trailRunning=false;
    },6500);
}


/* =========================================================
   EXPLOSIÓN
========================================================= */

function createBurst(x,y,amount=260){

    for(let i=0;i<amount;i++){

        const p=document.createElement("div");

        p.style.position="absolute";

        const size=1.5+Math.random()*4;

        p.style.width=size+"px";
        p.style.height=size+"px";

        p.style.borderRadius="50%";

        p.style.background=
            Math.random()>.35
            ? "#ffd94d"
            : "#fff3a0";

        p.style.boxShadow=
            "0 0 10px rgba(255,210,60,.9)";

        p.style.left=x+"px";
        p.style.top=y+"px";

        p.style.pointerEvents="none";

        const angle=Math.random()*Math.PI*2;

        const distance=
            70 + Math.random()*550;

        const dx=Math.cos(angle)*distance;
        const dy=Math.sin(angle)*distance;

        p.animate(
            [
                {
                    transform:"translate(-50%,-50%) scale(1)",
                    opacity:1
                },
                {
                    transform:
                        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`,
                    opacity:0
                }
            ],
            {
                duration:1200+Math.random()*1300,
                easing:"cubic-bezier(.1,.7,.2,1)",
                fill:"forwards"
            }
        );

        burstLayer.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },2700);
    }
}


/* =========================================================
   FLORES FINALES
========================================================= */

function createFinalFlowers(amount=110){

    for(let i=0;i<amount;i++){

        const flower=document.createElement("div");

        flower.className="finalFlower";

        flower.style.left=
            Math.random()*97+"%";

        flower.style.top=
            Math.random()*93+"%";

        flower.style.setProperty(
            "--scale",
            (.45+Math.random()*1.15).toFixed(2)
        );

        flower.style.setProperty(
            "--appear",
            (Math.random()*3)+"s"
        );

        flower.innerHTML=`

            <div class="fpetal"></div>
            <div class="fpetal"></div>
            <div class="fpetal"></div>
            <div class="fpetal"></div>
            <div class="fpetal"></div>
            <div class="fpetal"></div>
            <div class="fpetal"></div>
            <div class="fpetal"></div>

            <div class="fcenter"></div>

        `;

        finalScene.appendChild(flower);
    }
}


/* =========================================================
   MÚSICA
========================================================= */

function startMusic(){

    music.volume=0;

    music.currentTime=0;

    const promise=music.play();

    if(promise!==undefined){

        promise.then(()=>{

            let volume=0;

            const fade=setInterval(()=>{

                volume+=.015;

                music.volume=Math.min(volume,.8);

                if(volume>=.8){

                    clearInterval(fade);

                }

            },100);

        }).catch(error=>{

            console.log("Audio:",error);

        });
    }
}


/* =========================================================
   SECUENCIA PRINCIPAL
========================================================= */

async function experience(){

    createStars(120);
    createGoldDust(280);

    await wait(1800);


    /* -------------------------------------
       INTRO 1
    ------------------------------------- */

    await showIntroText(
        "Hay algo que quería darte...",
        2600
    );


    /* -------------------------------------
       INTRO 2
    ------------------------------------- */

    await showIntroText(
        "pero no encontré la manera de hacerlo.",
        2900
    );


    /* -------------------------------------
       INTRO 3
    ------------------------------------- */

    await showIntroText(
        "Así que hice esto.",
        2300
    );


    /* -------------------------------------

    ------------------------------------- */

    intro.style.opacity="0";

    await wait(1200);

    ------------------------------------- */

    flowerScene.classList.add("active");

}


experience();


/* =========================================================
   CLICK EN LA FLOR
========================================================= */

mainFlower.addEventListener("click",async()=>{

    mainFlower.style.pointerEvents="none";

    const rect=mainFlower.getBoundingClientRect();

    createBurst(
        rect.left+rect.width/2,
        rect.top+rect.height/2,
        150
    );

    mainFlower.style.transform="scale(.15)";
    mainFlower.style.opacity="0";

    flowerLabel.style.opacity="0";

    await wait(900);

    flowerScene.style.opacity="0";

    await wait(1200);


    /* -------------------------------------
       MARIPOSA
    ------------------------------------- */

    butterfly.classList.add("fly");

    butterflyTrail();

    await wait(4700);


    /* -------------------------------------
       TEXTO
    ------------------------------------- */

    butterflyText.classList.add("show");

    await wait(4200);

    butterflyText.classList.remove("show");

    butterfly.style.opacity="0";

    await wait(1600);


    /* -------------------------------------
       ESCENA FINAL

    finalScene.classList.add("show");

    createFinalFlowers(110);

    /* -------------------------------------

    ------------------------------------- */

    finalMessage.classList.add("show");

    await wait(3800);


    /* -------------------------------------
       CORAZÓN
    ------------------------------------- */

    heart.classList.add("show");

    await wait(1600);

    heartHint.classList.add("show");

});


/* =========================================================
   CLICK CORAZÓN
========================================================= */

heart.addEventListener("click",async()=>{

    heart.style.pointerEvents="none";

    heartHint.style.opacity="0";

    const rect=heart.getBoundingClientRect();

    const x=rect.left+rect.width/2;
    const y=rect.top+rect.height/2;


    /* -------------------------------------
       FLASH
    ------------------------------------- */

    flash.animate(
        [
            {opacity:0},
            {opacity:.5},
            {opacity:0}
        ],
        {
            duration:700,
            easing:"ease-out"
        }
    );


    /* -------------------------------------
       EXPLOSIÓN GRANDE
    ------------------------------------- */

    createBurst(x,y,320);


    /* -------------------------------------
       MÚSICA
    ------------------------------------- */

    startMusic();


    /* -------------------------------------
       DESAPARECER ELEMENTOS
    ------------------------------------- */

    heart.style.opacity="0";

    finalMessage.style.opacity="0";

    await wait(1400);


    /* -------------------------------------
       MENSAJE SECRETO
    ------------------------------------- */

    secretMessage.classList.add("show");

});
