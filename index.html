<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💛</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    color:#fff;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#message{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:clamp(27px,5vw,52px);
    line-height:1.35;
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
    z-index:5;
}

#message.visible{
    opacity:1;
}

#hint{
    position:fixed;
    left:0;
    right:0;
    bottom:12%;
    text-align:center;
    font-size:18px;
    letter-spacing:2px;
    opacity:0;
    transition:opacity .8s ease;
    pointer-events:none;
    z-index:6;
}

#hint.visible{
    opacity:.8;
}

#heart{
    position:fixed;
    left:50%;
    bottom:10%;
    transform:translateX(-50%);
    font-size:100px;
    line-height:1;
    color:#ffd83d;
    text-shadow:
        0 0 12px #ffd83d,
        0 0 30px #ffb900,
        0 0 60px rgba(255,190,0,.7);
    opacity:0;
    pointer-events:none;
    z-index:10;
    cursor:pointer;
    user-select:none;
    transition:opacity 1s ease;
}

#heart.visible{
    opacity:1;
    pointer-events:auto;
    animation:heartPulse 1.4s ease-in-out infinite;
}

@keyframes heartPulse{
    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.12);
    }
}

#secret{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:clamp(27px,5vw,52px);
    line-height:1.4;
    opacity:0;
    pointer-events:none;
    z-index:20;
    transition:opacity 1.5s ease;
    text-shadow:0 0 25px rgba(255,215,80,.8);
}

#secret.visible{
    opacity:1;
}

#audio{
    display:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="message"></div>

<div id="hint">toca la flor</div>

<div id="heart">♥</div>

<div id="secret">
    Y si algún día te preguntas<br>
    por qué hice todo esto...<br><br>
    la respuesta siempre vas a ser tú. 💛
</div>

<audio id="audio" preload="auto">
    <source src="./Álvaro Díaz - Reina Pepiada (Lyric Video).mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const hint = document.getElementById("hint");
const heart = document.getElementById("heart");
const secret = document.getElementById("secret");
const audio = document.getElementById("audio");

let W;
let H;
let dpr;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1,1.5);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

}

resize();

window.addEventListener("resize",resize);


// ==================================================
// ESTADO DE LA HISTORIA
// ==================================================

let scene = "intro1";
let sceneTime = performance.now();

function changeScene(newScene){

    scene = newScene;
    sceneTime = performance.now();

    message.classList.remove("visible");
    hint.classList.remove("visible");

}

function elapsed(){

    return performance.now()-sceneTime;

}


// ==================================================
// TEXTO
// ==================================================

function showMessage(text){

    message.innerHTML = text;
    message.classList.add("visible");

}

function hideMessage(){

    message.classList.remove("visible");

}


// ==================================================
// FLOR PRINCIPAL
// ==================================================

const flower = {
    x:0,
    y:0
};

function drawFlower(progress){

    flower.x = W/2;
    flower.y = H*.52;

    const p = Math.min(progress,1);

    ctx.save();

    // Tallo

    ctx.beginPath();

    ctx.moveTo(
        flower.x,
        flower.y+15
    );

    ctx.quadraticCurveTo(
        flower.x-20,
        flower.y+110*p,
        flower.x-5,
        H
    );

    ctx.strokeStyle="#52752b";
    ctx.lineWidth=7;
    ctx.stroke();


    // Hoja izquierda

    if(p>.35){

        ctx.beginPath();

        ctx.ellipse(
            flower.x-27,
            flower.y+95,
            17,
            43,
            -.65,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#668d32";
        ctx.fill();

    }


    // Hoja derecha

    if(p>.55){

        ctx.beginPath();

        ctx.ellipse(
            flower.x+28,
            flower.y+125,
            17,
            43,
            .65,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#5c8230";
        ctx.fill();

    }


    // Pétalos

    const radius = 72*p;

    for(let i=0;i<12;i++){

        const angle =
            i*Math.PI*2/12;

        ctx.save();

        ctx.translate(
            flower.x,
            flower.y
        );

        ctx.rotate(angle);

        ctx.beginPath();

        ctx.ellipse(
            0,
            -radius*.65,
            radius*.43,
            radius*.78,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffd83d";

        ctx.fill();

        ctx.restore();

    }


    // Centro

    ctx.beginPath();

    ctx.arc(
        flower.x,
        flower.y,
        radius*.38,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#805117";
    ctx.fill();


    // Detalles del centro

    for(let i=0;i<18;i++){

        const a =
            i*Math.PI*2/18;

        const r = radius*.25;

        ctx.beginPath();

        ctx.arc(
            flower.x+Math.cos(a)*r,
            flower.y+Math.sin(a)*r,
            2,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#b87518";

        ctx.fill();

    }

    ctx.restore();

}


// ==================================================
// PARTÍCULAS
// ==================================================

const particles = [];

function createBurst(x,y,count){

    particles.length=0;

    for(let i=0;i<count;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            1+Math.random()*5;

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            size:1+Math.random()*4,

            life:1

        });

    }

}

function drawParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.98;
        p.vy*=.98;

        p.vy+=.025;

        p.life-=.018;

        if(p.life<=0){

            particles.splice(i,1);

            continue;

        }

        ctx.globalAlpha=p.life;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffd84d";

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


// ==================================================
// MARIPOSA
// ==================================================

function drawButterfly(progress){

    const t=Math.min(progress,1);

    const startX=W/2;
    const startY=H*.52;

    const endX=W+100;
    const endY=H*.18;

    const x =
        startX+
        (endX-startX)*t+
        Math.sin(t*10)*35*(1-t);

    const y =
        startY+
        (endY-startY)*t+
        Math.sin(t*9)*40*(1-t);


    const flap =
        Math.sin(performance.now()*.025);


    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(-.2);


    // Ala izquierda

    ctx.beginPath();

    ctx.ellipse(
        -9,
        -3,
        15,
        9+flap*3,
        -.5,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f6d56b";

    ctx.fill();


    // Ala derecha

    ctx.beginPath();

    ctx.ellipse(
        9,
        -3,
        15,
        9-flap*3,
        .5,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffe18a";

    ctx.fill();


    // Cuerpo

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        3,
        11,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#4c371d";

    ctx.fill();


    ctx.restore();

}


// ==================================================
// FLORES QUE CAEN
// ==================================================

const rainFlowers=[];

function createRain(){

    rainFlowers.length=0;

    for(let i=0;i<55;i++){

        rainFlowers.push({

            x:Math.random()*W,

            y:-Math.random()*H,

            size:5+Math.random()*10,

            speed:1.5+Math.random()*2.8,

            sway:Math.random()*Math.PI*2,

            rotation:Math.random()*Math.PI*2,

            rotationSpeed:(Math.random()-.5)*.025,

            alpha:.5+Math.random()*.5

        });

    }

}

function drawRainFlower(f){

    ctx.save();

    ctx.translate(f.x,f.y);

    ctx.rotate(f.rotation);

    ctx.globalAlpha=f.alpha;


    // tallo

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.lineTo(0,f.size*2.5);

    ctx.strokeStyle="#66863b";

    ctx.lineWidth=1;

    ctx.stroke();


    // pétalos

    for(let i=0;i<5;i++){

        ctx.save();

        ctx.rotate(
            i*Math.PI*2/5
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -f.size*.65,
            f.size*.45,
            f.size*.75,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffd83d";

        ctx.fill();

        ctx.restore();

    }


    // centro

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        f.size*.27,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#805117";

    ctx.fill();

    ctx.restore();

}

function updateRain(){

    for(const f of rainFlowers){

        f.y+=f.speed;

        f.sway+=.025;

        f.x+=Math.sin(f.sway)*.35;

        f.rotation+=f.rotationSpeed;

        if(f.y>H+30){

            f.y=-20;

            f.x=Math.random()*W;

        }

        drawRainFlower(f);

    }

}


// ==================================================
// FONDO
// ==================================================

function drawBackground(){

    ctx.fillStyle="#020203";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


// ==================================================
// LOOP PRINCIPAL
// ==================================================

function loop(){

    drawBackground();

    const time=elapsed();


    // ----------------------------------------------
    // INTRO
    // ----------------------------------------------

    if(scene==="intro1"){

        if(time>300){

            showMessage(
                "Hay algo que quería darte..."
            );

        }

        if(time>3300){

            changeScene("intro2");

            showMessage(
                "pero no encontré la manera de hacerlo."
            );

        }

    }


    else if(scene==="intro2"){

        if(time>3500){

            changeScene("intro3");

            showMessage(
                "Así que hice esto."
            );

        }

    }


    else if(scene==="intro3"){

        if(time>3300){

            changeScene("light");

        }

    }


    // ----------------------------------------------
    // LUZ
    // ----------------------------------------------

    else if(scene==="light"){

        const p=Math.min(time/1800,1);

        const radius=
            80+
            p*450;

        const gradient=
            ctx.createRadialGradient(
                W/2,
                H*.55,
                0,
                W/2,
                H*.55,
                radius
            );

        gradient.addColorStop(
            0,
            "rgba(255,220,100,.9)"
        );

        gradient.addColorStop(
            .3,
            "rgba(255,190,50,.35)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        if(time>1800){

            changeScene("flower");

            hint.classList.add("visible");

        }

    }


    // ----------------------------------------------
    // FLOR
    // ----------------------------------------------

    else if(scene==="flower"){

        const p=Math.min(time/1700,1);

        drawFlower(p);

        if(p>=1){

            hint.classList.add("visible");

        }

    }


    // ----------------------------------------------
    // MARIPOSA
    // ----------------------------------------------

    else if(scene==="butterfly"){

        drawFlower(1);

        const p=
            Math.min(time/2300,1);

        drawButterfly(p);

        drawParticles();


        if(time>500 && time<1700){

            showMessage(
                "Porque hay cosas que no caben en una simple flor."
            );

        }


        if(p>=1){

            createRain();

            changeScene("rain");

        }

    }


    // ----------------------------------------------
    // LLUVIA DE FLORES
    // ----------------------------------------------

    else if(scene==="rain"){

        updateRain();

        if(time>1300){

            changeScene("final");

            showMessage(
                "Y esta es mi pequeña manera<br>" +
                "de darte algo bonito. 💛"
            );

        }

    }


    // ----------------------------------------------
    // MENSAJE FINAL
    // ----------------------------------------------

    else if(scene==="final"){

        updateRain();

        if(time>2600){

            changeScene("heart");

            showMessage(
                "Y esta es mi pequeña manera<br>" +
                "de darte algo bonito. 💛"
            );

            heart.classList.add("visible");

        }

    }


    // ----------------------------------------------
    // CORAZÓN
    // ----------------------------------------------

    else if(scene==="heart"){

        updateRain();

    }


    // ----------------------------------------------
    // EXPLOSIÓN
    // ----------------------------------------------

    else if(scene==="explosion"){

        updateRain();

        drawParticles();

        const p=
            Math.min(time/2500,1);

        const radius=
            p*Math.max(W,H)*.9;

        const gradient=
            ctx.createRadialGradient(
                W/2,
                H/2,
                0,
                W/2,
                H/2,
                radius
            );

        gradient.addColorStop(
            0,
            "rgba(255,240,150,.85)"
        );

        gradient.addColorStop(
            .25,
            "rgba(255,210,70,.35)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,190,0,0)"
        );

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        if(time>300){

            if(audio.paused){

                audio.volume=.7;

                audio.play().catch(()=>{});

            }

        }


        if(time>2700){

            changeScene("secret");

            secret.classList.add("visible");

        }

    }


    // ----------------------------------------------
    // SECRETO
    // ----------------------------------------------

    else if(scene==="secret"){

        updateRain();

    }


    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


// ==================================================
// TOCAR FLOR
// ==================================================

function touchFlower(x,y){

    if(scene!=="flower"){
        return;
    }

    const dx=x-flower.x;
    const dy=y-flower.y;

    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );

    if(distance<120){

        hint.classList.remove("visible");

        createBurst(
            flower.x,
            flower.y,
            120
        );

        changeScene("butterfly");

    }

}


canvas.addEventListener(
    "click",
    function(e){

        touchFlower(
            e.clientX,
            e.clientY
        );

    }
);


canvas.addEventListener(
    "touchstart",
    function(e){

        const touch=e.touches[0];

        touchFlower(
            touch.clientX,
            touch.clientY
        );

    },
    {passive:true}
);


// ==================================================
// CORAZÓN
// ==================================================

heart.addEventListener(
    "click",
    function(){

        heart.classList.remove("visible");

        createBurst(
            W/2,
            H*.5,
            220
        );

        changeScene("explosion");

    }
);

</script>

</body>
</html>
